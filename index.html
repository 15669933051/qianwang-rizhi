<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>施工日志</title>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.12/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater-image-module-free@1.1.1/dist/image-module.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SimSun",sans-serif;}
        body{background:#f0f2f5;padding-bottom:80px;}
        .header{background:#1a73e8;color:#fff;text-align:center;padding:14px 10px;font-size:17px;font-weight:600;line-height:1.4;}
        .wrap{padding:12px;}
        .form-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px;}
        .row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
        .row label{width:80px;font-size:14px;color:#333;flex-shrink:0;}
        .row input,.row select{flex:1;border:1px solid #ddd;border-radius:6px;padding:10px 8px;font-size:15px;}
        .full-row{margin-bottom:10px;}
        .full-row label{display:block;font-size:14px;color:#333;margin-bottom:6px;font-weight:500;}
        .full-row textarea{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:15px;min-height:80px;resize:vertical;}
        .title-row{background:#f5f7fa;padding:8px 10px;border-radius:6px;font-size:14px;font-weight:600;color:#1a73e8;margin-bottom:10px;}
        .photo-box{margin-top:8px;}
        .photo-btn{width:100%;padding:12px;background:#e8f0fe;border:1px dashed #1a73e8;border-radius:6px;color:#1a73e8;font-size:15px;text-align:center;}
        .photo-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
        .photo-item{width:80px;height:80px;border-radius:6px;overflow:hidden;position:relative;}
        .photo-item img{width:100%;height:100%;object-fit:cover;}
        .photo-del{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(0,0,0,0.6);color:#fff;border-radius:50%;font-size:12px;text-align:center;line-height:20px;}
        .save-btn-wrap{padding:12px;}
        #saveLogBtn{width:100%;padding:14px;background:#1a73e8;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;}
        .tab-bar{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;}
        .tab{flex:1;text-align:center;padding:12px 0;font-size:15px;color:#666;}
        .tab.active{color:#1a73e8;font-weight:500;}
        .page{display:none;}
        .page.active{display:block;}
        .log-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;}
        .log-card h4{font-size:15px;color:#333;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:6px;}
        .log-card p{font-size:13px;line-height:1.6;color:#555;margin-bottom:3px;}
        .log-card p b{color:#333;}
        .log-photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
        .log-photos img{width:70px;height:70px;border-radius:4px;object-fit:cover;}
        .del-btn{margin-top:8px;color:#e53935;border:none;background:none;font-size:14px;}
        .docx-btn{margin-top:8px;margin-right:12px;color:#1a73e8;border:none;background:none;font-size:14px;}
        .add-row{display:flex;gap:6px;margin-top:6px;}
        .add-row input{flex:1;border:1px solid #ddd;border-radius:6px;padding:8px;font-size:14px;}
        .add-row button{width:70px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:14px;}
        .empty-tip{text-align:center;color:#999;padding:40px 0;font-size:14px;}
        .list-top-bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
        .list-top-bar button{flex:1;min-width:110px;padding:10px;border:none;border-radius:6px;background:#1a73e8;color:#fff;font-size:14px;}
        #importFileInput{display:none;}
    </style>
</head>
<body>
    <div class="header" id="headerTitle">施工日志</div>
    <div class="wrap">
        <div id="page-form" class="page active">
            <div class="form-card">
                <div class="row"><label>选择项目</label><select id="project"></select></div>
                <div class="add-row"><input type="text" id="newProjectInput" placeholder="输入新项目名称"><button id="addProjectBtn">添加</button></div>
            </div>
            <div class="form-card">
                <div class="row"><label>项目地址</label><input type="text" id="projectAddr" placeholder="如：临安"></div>
                <div class="row"><label>建设单位</label><input type="text" id="buildUnit" placeholder="建设单位名称"></div>
                <div class="row"><label>施工单位</label><input type="text" id="contractor" placeholder="施工单位"></div>
                <div class="row"><label>监理单位</label><input type="text" id="supervisor" placeholder="监理单位"></div>
                <div class="row"><label>设计单位</label><input type="text" id="designUnit" placeholder="设计单位"></div>
            </div>
            <div class="form-card">
                <div class="row"><label>施工日期</label><input type="date" id="workDate"></div>
                <div class="row"><label>天气</label><input type="text" id="weather" placeholder="晴"></div>
                <div class="row"><label>风力</label><input type="text" id="wind" placeholder="东北风 2级"></div>
                <div class="row"><label>温度</label><input type="text" id="tempInfo" placeholder="19°C"></div>
                <div class="row"><label>负责人</label><input type="text" id="personCharge" placeholder="工程负责人"></div>
                <div class="row"><label>记录人</label><input type="text" id="recorder" placeholder="记录人"></div>
            </div>
            <div class="form-card">
                <div class="full-row"><label>■ 生产情况记录（今日完成 / 明日计划）</label>
                    <textarea id="workToday" placeholder="今日完成：&#10;1、..."></textarea>
                </div>
            </div>
            <div class="form-card">
                <div class="full-row"><label>■ 技术质量安全工作记录</label>
                    <textarea id="qualitySafe" placeholder="质量、安全、技术工作情况..."></textarea>
                </div>
            </div>
            <div class="form-card">
                <div class="full-row"><label>■ 材料、构配件进场记录</label>
                    <textarea id="materialRecord" placeholder="无 / 进场材料明细..."></textarea>
                </div>
            </div>
            <div class="form-card">
                <div class="full-row"><label>■ 现场照片（自动按每行3张排入表格）</label>
                    <div class="photo-box">
                        <input type="file" id="photoInput" accept="image/*" style="display:none">
                        <button class="photo-btn" onclick="document.getElementById('photoInput').click()">📷 拍照 / 从相册选择照片</button>
                        <div class="photo-list" id="photoList"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="page-list" class="page">
            <div class="list-top-bar">
                <button onclick="exportAllBackup()">📦全部日志备份(json)</button>
                <button onclick="document.getElementById('importFileInput').click()">📂导入备份</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none">
            </div>
            <div id="listBox"></div>
        </div>
        <div id="page-set" class="page">
            <div class="form-card"><div class="title-row">项目管理</div><div id="projectManageBox"></div></div>
            <div class="form-card">
                <div class="title-row">项目信息设置（先选项目再编辑）</div>
                <div class="row"><label>选择项目</label><select id="setProjectSel"></select></div>
                <div class="row"><label>项目地址</label><input type="text" id="setProjectAddr" placeholder="该项目地址"></div>
                <div class="row"><label>建设单位</label><input type="text" id="setBuildUnit" placeholder="该项目建设单位"></div>
                <div class="row"><label>施工单位</label><input type="text" id="setContractor" placeholder="该项目施工单位"></div>
                <div class="row"><label>监理单位</label><input type="text" id="setSupervisor" placeholder="该项目监理单位"></div>
                <div class="row"><label>设计单位</label><input type="text" id="setDesignUnit" placeholder="该项目设计单位"></div>
                <button class="add-row" style="width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:15px;margin-top:10px;" onclick="saveProjectInfo()">保存当前项目信息</button>
            </div>
        </div>
    </div>
    <div class="save-btn-wrap"><button id="saveLogBtn">💾保存本条施工日志</button></div>
    <div class="tab-bar">
        <div class="tab" data-page="page-form">记日志</div>
        <div class="tab" data-page="page-list">日志列表</div>
        <div class="tab" data-page="page-set">设置</div>
    </div>

<script>
function updateHeaderTitle(name){document.getElementById('headerTitle').innerText=name+' 施工日志';}
function getProjectList(){
    const raw=localStorage.getItem('roadProjectList');
    if(raw){
        const arr=JSON.parse(raw);
        if(arr.length>0&&typeof arr[0]==='string'){
            return arr.map(n=>({name:n,projectAddr:'',buildUnit:'',contractor:'',supervisor:'',designUnit:'',contractNo:''}));
        }
        return arr;
    }
    return [{name:'默认项目',projectAddr:'',buildUnit:'',contractor:'',supervisor:'',designUnit:'',contractNo:''}];
}
function saveProjectList(arr){localStorage.setItem('roadProjectList',JSON.stringify(arr));}
function findProject(name){return getProjectList().find(p=>p.name===name);}
function renderProjectSelect(){
    const sel=document.getElementById('project');const list=getProjectList();
    sel.innerHTML='';list.forEach(p=>{const o=document.createElement('option');o.innerText=p.name;o.value=p.name;sel.appendChild(o);});
    bindProjectChange();fillByProject(sel.value);updateHeaderTitle(sel.value);
}
function renderSetProjectSel(){
    const sel=document.getElementById('setProjectSel');const list=getProjectList();
    sel.innerHTML='';list.forEach(p=>{const o=document.createElement('option');o.innerText=p.name;o.value=p.name;sel.appendChild(o);});
    bindSetProjectChange();fillSetFormByProject(sel.value);
}
function bindProjectChange(){const sel=document.getElementById('project');sel.onchange=function(){fillByProject(this.value);updateHeaderTitle(this.value);};}
function fillByProject(name){
    const p=findProject(name);
    if(p){
        document.getElementById('projectAddr').value=p.projectAddr;
        document.getElementById('buildUnit').value=p.buildUnit;
        document.getElementById('contractor').value=p.contractor;
        document.getElementById('supervisor').value=p.supervisor;
        document.getElementById('designUnit').value=p.designUnit;
    }
}
function bindSetProjectChange(){const sel=document.getElementById('setProjectSel');sel.onchange=function(){fillSetFormByProject(this.value);};}
function fillSetFormByProject(name){
    const p=findProject(name);
    if(p){
        document.getElementById('setProjectAddr').value=p.projectAddr;
        document.getElementById('setBuildUnit').value=p.buildUnit;
        document.getElementById('setContractor').value=p.contractor;
        document.getElementById('setSupervisor').value=p.supervisor;
        document.getElementById('setDesignUnit').value=p.designUnit;
    }
}
function saveProjectInfo(){
    const name=document.getElementById('setProjectSel').value;const arr=getProjectList();
    const t=arr.find(p=>p.name===name);
    if(t){
        t.projectAddr=document.getElementById('setProjectAddr').value;
        t.buildUnit=document.getElementById('setBuildUnit').value;
        t.contractor=document.getElementById('setContractor').value;
        t.supervisor=document.getElementById('setSupervisor').value;
        t.designUnit=document.getElementById('setDesignUnit').value;
    }
    saveProjectList(arr);renderProjectSelect();alert('✅该项目信息已保存！切换项目会自动带出');
}
document.getElementById('addProjectBtn').onclick=function(){
    const v=document.getElementById('newProjectInput').value.trim();
    if(!v){alert('项目名称不能为空');return;}
    const arr=getProjectList();
    if(arr.some(p=>p.name===v)){alert('该项目已存在');return;}
    arr.push({name:v,projectAddr:'',buildUnit:'',contractor:'',supervisor:'',designUnit:'',contractNo:''});
    saveProjectList(arr);renderProjectSelect();renderSetProjectSel();document.getElementById('newProjectInput').value='';
};

let photos=[];
document.getElementById('photoInput').onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
        const img=new Image();
        img.onload=function(){
            const canvas=document.createElement('canvas');
            const maxW=900;const scale=Math.min(1,maxW/img.width);
            canvas.width=img.width*scale;canvas.height=img.height*scale;
            canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
            const compressed=canvas.toDataURL('image/jpeg',0.55);
            photos.push(compressed);renderPhotos();
        };
        img.src=ev.target.result;
    };
    reader.readAsDataURL(file);e.target.value='';
};
function renderPhotos(){
    const box=document.getElementById('photoList');box.innerHTML='';
    photos.forEach((p,idx)=>{
        const div=document.createElement('div');div.className='photo-item';
        div.innerHTML=`<img src="${p}"><div class="photo-del" onclick="delPhoto(${idx})">×</div>`;
        box.appendChild(div);
    });
}
function delPhoto(idx){photos.splice(idx,1);renderPhotos();}

const today=new Date();
document.getElementById('workDate').value=today.toISOString().slice(0,10);

const tabs=document.querySelectorAll('.tab');
tabs.forEach(tab=>{
    tab.onclick=()=>{
        tabs.forEach(t=>t.classList.remove('active'));tab.classList.add('active');
        const id=tab.dataset.page;
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id==='page-list')renderList();
        if(id==='page-set'){renderProjectManage();renderSetProjectSel();}
    };
});
function getLogs(){const raw=localStorage.getItem('roadLog');return raw?JSON.parse(raw):[];}
function saveLogs(arr){localStorage.setItem('roadLog',JSON.stringify(arr));}

document.getElementById('saveLogBtn').onclick=function(){
    const workDate=document.getElementById('workDate').value;
    if(!workDate){alert('施工日期不能为空！');return;}
    const log={
        id:Date.now(),
        project:document.getElementById('project').value,
        projectAddr:document.getElementById('projectAddr').value,
        buildUnit:document.getElementById('buildUnit').value,
        contractor:document.getElementById('contractor').value,
        supervisor:document.getElementById('supervisor').value,
        designUnit:document.getElementById('designUnit').value,
        workDate:workDate,
        weather:document.getElementById('weather').value,
        wind:document.getElementById('wind').value,
        tempInfo:document.getElementById('tempInfo').value,
        personCharge:document.getElementById('personCharge').value,
        recorder:document.getElementById('recorder').value,
        workToday:document.getElementById('workToday').value,
        qualitySafe:document.getElementById('qualitySafe').value,
        materialRecord:document.getElementById('materialRecord').value,
        photos:[...photos]
    };
    const logs=getLogs();logs.unshift(log);saveLogs(logs);
    alert('✅日志保存成功！');
    photos=[];renderPhotos();
    document.getElementById('workToday').value='';
    document.getElementById('qualitySafe').value='';
    document.getElementById('materialRecord').value='';
    document.getElementById('weather').value='';
    document.getElementById('wind').value='';
    document.getElementById('tempInfo').value='';
    document.getElementById('personCharge').value='';
    document.getElementById('recorder').value='';
};

// ======== 生成与上传的Word模板相同排版的 .docx（图片自动每行3格填入） ========
async function exportRealDocx(logItem){
    if(typeof window.ImageModule==='undefined'){
        alert('docx组件未加载成功，请联网并刷新页面（建议在电脑Chrome导出）');return;
    }
    alert('正在生成docx，图片会打包进Word，照片越多越慢，请稍候……');
    const imageModule=new window.ImageModule({
        getImage:function(tagValue){
            return fetch(tagValue).then(r=>r.arrayBuffer());
        },
        getSize:function(){return {width:190,height:140};}
    });

    // 图片每3张一行分组，自动填入表格格子
    const rows=[];const arr=logItem.photos||[];
    for(let i=0;i<arr.length;i+=3){
        rows.push({p1:arr[i]||null,p2:arr[i+1]||null,p3:arr[i+2]||null});
    }
    if(rows.length===0)rows.push({p1:null,p2:null,p3:null});

    // 计算星期
    const wd=['日','一','二','三','四','五','六'];
    let weekday='';
    try{
        const dd=new Date(logItem.workDate);
        weekday='星期'+wd[dd.getDay()];
    }catch(e){}

    // 生产记录合并今日+明日
    const prod = (logItem.workToday||'').trim();
    const plan = ''; // 模板无明日计划独立栏，可并入生产记录

    // docx模板XML（严格按上传模板排版）
    const templateContent = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<w:p><w:r><w:t></w:t></w:r></w:p>

<w:insideH w:val="single" w:sz="6"/><w:insideV w:val="single" w:sz="6"/>
</w:tblBorders></w:tblPr>

<w:tc><w:tcPr><w:tcW w:w="1500"/></w:tcPr><w:p><w:r><w:t>项目名称</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="2500"/></w:tcPr><w:p><w:r><w:t>{project}</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="1500"/></w:tcPr><w:p><w:r><w:t>项目地址</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="2500"/></w:tcPr><w:p><w:r><w:t>{projectAddr}</w:t></w:r></w:p></w:tc>
</w:tr>

</w:tr>
<w:tr>
<w:tc><w:tcPr><w:tcW w:w="1500"/></w:tcPr><w:p><w:r><w:t>施工单位</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="2500"/></w:tcPr><w:p><w:r><w:t>{contractor}</w:t></w:r></w:p></w:tc>

<w:tc><w:tcPr><w:tcW w:w="2500"/></w:tcPr><w:p><w:r><w:t>{designUnit}</w:t></w:r></w:p></w:tc>
</w:tr>
<w:tr>
<w:tc><w:tcPr><w:tcW w:w="8000"/><w:gridSpan w:val="4"/></w:tcPr><w:p><w:r><w:t>日　　期：{workDate}　{weekday}</w:t></w:r></w:p></w:tc>
</w:tr>
<w:tr>
<w:tc><w:tcPr><w:tcW w:w="1500"/></w:tcPr><w:p><w:r><w:t>天气</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="2500"/></w:tcPr><w:p><w:r><w:t>{weather}</w:t></w:r></w:p></w:tc>

<w:tc><w:tcPr><w:tcW w:w="1500"/></w:tcPr><w:p><w:r><w:t>温度</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="2500"/></w:tcPr><w:p><w:r><w:t>{tempInfo}</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="1500"/></w:tcPr><w:p><w:r><w:t>备注</w:t></w:r></w:p></w:tc>
<w:tc><w:tcPr><w:tcW w:w="2500"/></w:tcPr><w:p><w:r><w:t>{remark}</w:t></w:r></w:p></w:tc>
</w:tr>
<w:tr>
<w:tc><w:tcPr><w:tcW w:w="8000"/><w:gridSpan w:val="4"/><w:shd w:fill="D9D9D9"/></w:tcPr><w:p><w:r><w:b><w:t>生产情况记录</w:t></w:b></w:r></w:p></w:tc>

function exportAllBackup(){
    const allData={projectList:getProjectList(),logs:getLogs()};
    const blob=new Blob([JSON.stringify(allData,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`施工日志全部备份_${new Date().toLocaleDateString()}.json`;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    alert('全部备份已下载！妥善保存，清除浏览器缓存后可以恢复数据');
}
document.getElementById('importFileInput').onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=function(ev){
        try{
            const data=JSON.parse(ev.target.result);
            if(data.projectList)saveProjectList(data.projectList);
            if(data.logs)saveLogs(data.logs);
            renderProjectSelect();renderSetProjectSel();renderProjectManage();
            alert('✅导入备份成功！');
        }catch(err){alert('文件格式错误，不是备份json');}
    };
    reader.readAsText(f);e.target.value='';
};
function renderList(){
    const box=document.getElementById('listBox');const logs=getLogs();
    if(logs.length===0){box.innerHTML='<div class="empty-tip">暂无施工日志记录</div>';return;}
    let html='';
    logs.forEach(item=>{
        html+=`
        <div class="log-card">
            <h4>${item.workDate} 施工日志｜${item.project}</h4>
            <p><b>项目地址：</b>${item.projectAddr||'-'}</p>
            <p><b>建设单位：</b>${item.buildUnit||'-'}</p>
            <p><b>施工单位：</b>${item.contractor||'-'}</p>
            <p><b>天气：</b>${item.weather||'-'}　风力：${item.wind||'-'}　温度：${item.tempInfo||'-'}</p>
            <p><b>【生产记录】</b>${item.workToday||'-'}</p>
            <p><b>【技术质量安全】</b>${item.qualitySafe||'-'}</p>
            <p><b>【材料进场】</b>${item.materialRecord||'-'}</p>
            ${item.photos&&item.photos.length>0?`<div class="log-photos">${item.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}
            <p><b>负责人：</b>${item.personCharge||'-'}　记录人：${item.recorder||'-'}</p>
            <button class="docx-btn" data-id="${item.id}">📄导出Word(docx)</button>
            <button class="del-btn" data-id="${item.id}">删除本条</button>
        </div>`;
    });
    box.innerHTML=html;
    document.querySelectorAll('.docx-btn').forEach(btn=>{
        btn.onclick=async()=>{
            const id=Number(btn.dataset.id);
            const one=getLogs().find(x=>x.id===id);
            if(one)await exportRealDocx(one);
        };
    });
    document.querySelectorAll('.del-btn').forEach(btn=>{
        btn.onclick=()=>{
            if(!confirm('确定删除这条日志吗？'))return;
            const id=Number(btn.dataset.id);
            let arr=getLogs().filter(x=>x.id!==id);
            saveLogs(arr);renderList();
        };
    });
}
function renderProjectManage(){
    const box=document.getElementById('projectManageBox');const list=getProjectList();
    let html='';
    list.forEach(p=>{
        html+=`
        <div class="log-card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:14px;">${p.name}</span>
            <button class="del-btn" data-pro="${p.name}" style="margin-top:0;">删除</button>
        </div>`;
    });
    box.innerHTML=html;
    document.querySelectorAll('.del-btn').forEach(btn=>{
        btn.onclick=()=>{
            const pName=btn.dataset.pro;
            if(pName==='默认项目'){alert('默认项目不能删除');return;}
            if(!confirm(`确定删除项目「${pName}」吗？`))return;
            let arr=getProjectList().filter(x=>x.name!==pName);
            saveProjectList(arr);renderProjectSelect();renderSetProjectSel();renderProjectManage();
        };
    });
}
renderProjectSelect();
