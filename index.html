<html lang="zh-CN">
<head>

<title>公路巡查日志</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.2.4/build/docx.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
body{background:#f5f7fa;color:#222;padding-bottom:80px;}
header{background:#1977d2;color:#fff;padding:14px;text-align:center;font-size:18px;font-weight:500;}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #ddd;}
.tab-bar>div{flex:1;text-align:center;padding:12px 4px;font-size:14px;color:#555;}
.tab-bar>div.active{color:#1977d2;font-weight:500;}
.page{display:none;padding:14px;}
.page.active{display:block;}
.form-item{margin-bottom:14px;}
label{display:block;margin-bottom:4px;font-size:14px;color:#444;}
input,select,textarea{width:100%;padding:10px 8px;border:1px solid #ccc;border-radius:6px;font-size:15px;background:#fff;}
textarea{min-height:80px;resize:vertical;}
.btn{padding:11px;border:none;border-radius:6px;background:#1977d2;color:#fff;font-size:15px;width:100%;margin:6px 0;}
.btn.gray{background:#888;}
.btn-group{display:flex;gap:8px;}
.btn-group .btn{flex:1;}
.photo-item{border:1px solid #ddd;padding:8px;border-radius:6px;margin:8px 0;}
.photo-item img{max-width:100%;border-radius:4px;}
.calendar-wrap{margin:12px 0;border:1px solid #ddd;border-radius:8px;padding:10px;}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{text-align:center;padding:6px;font-size:13px;border-radius:4px;}
.cal-day.today{background:#1977d2;color:#fff;}
.cal-day.has-record{position:relative;}
.cal-day.has-record::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:#1977d2;border-radius:50%;}
.cal-day.other-month{color:#bbb;}
.item-card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:8px 0;}
.project-tag{display:inline-block;background:#e8f0fb;color:#1977d2;padding:3px 8px;border-radius:4px;font-size:13px;margin:4px 0;}
.set-block{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0;}
.check-group{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
.check-item{display:flex;align-items:center;gap:4px;}
</style>
</head>
<body>
<header id="appTitle">公路巡查日志</header>

<div id="pageWrite" class="page active">
  <div class="form-item">
    <label>选择项目</label>
    <select id="selProject"></select>
  </div>
  <div class="form-item">
    <label>巡查日期</label>
    <input type="date" id="inpDate"/>
  </div>
  <div class="form-item">
    <label>天气</label>
    <input type="text" id="inpWeather" placeholder="例如：晴/阴/小雨"/>
  </div>
  <div class="form-item">
    <label>巡查桩号范围</label>
    <input type="text" id="inpStake" placeholder="K0+000 ~ K2+300"/>
  </div>
  <div class="form-item">
    <label>路面病害（可多选）</label>
    <div class="check-group">
      <label class="check-item"><input type="checkbox" value="裂缝" class="chkDisease"/>裂缝</label>
      <label class="check-item"><input type="checkbox" value="坑槽" class="chkDisease"/>坑槽</label>
      <label class="check-item"><input type="checkbox" value="沉陷" class="chkDisease"/>沉陷</label>
      <label class="check-item"><input type="checkbox" value="积水" class="chkDisease"/>积水</label>
    </div>
    <input type="text" id="inpDiseaseOther" placeholder="其他病害补充"/>
  </div>
  <div class="form-item">
    <label>交安设施损坏情况</label>
    <textarea id="inpSafetyFac" placeholder="护栏、标志、标线等"></textarea>
  </div>
  <div class="form-item">
    <label>施工安全隐患</label>
    <textarea id="inpRisk" placeholder="现场安全隐患描述"></textarea>
  </div>
  <div class="form-item">
    <label>人员到岗情况</label>
    <textarea id="inpStaff" placeholder="人员到岗情况"></textarea>
  </div>
  <div class="form-item">
    <label>施工/巡查内容（可拍照+备注）</label>
    <textarea id="inpContent" placeholder="文字记录"></textarea>
    <input type="file" id="filePhoto" accept="image/*" capture="environment" style="margin:8px 0"/>
    <div id="photoListWrite"></div>
  </div>
  <button class="btn" id="btnSaveLog">保存日志</button>
</div>

<div id="pageList" class="page">
  <div class="form-item">
    <label>筛选项目</label>
    <select id="selProjectFilter"></select>
  </div>
  <div class="calendar-wrap">
    <div class="cal-head">
      <button class="btn gray" id="calPrev">◀</button>
      <span id="calYM"></span>
      <button class="btn gray" id="calNext">▶</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div style="margin-top:8px;font-size:13px;"><span style="color:#1977d2;">●</span> 代表当日存在巡查记录</div>
  </div>
  <div id="logListWrap"></div>
</div>

<div id="pageSetting" class="page">
  <h3>项目管理</h3>
  <div id="projectListWrap"></div>
  <button class="btn" id="btnAddProject">+新建项目</button>
  <div class="set-block">
    <label>巡查人姓名（照片水印使用）</label>
    <input type="text" id="inpInspector" placeholder="填写本人姓名"/>
  </div>
  <div class="btn-group">
    <button class="btn" id="btnExportAll">批量导出全部记录</button>
  </div>
</div>

<div class="tab-bar">
  <div data-page="pageWrite" class="active">记日志</div>
  <div data-page="pageList">日志列表</div>
  <div data-page="pageSetting">设置</div>
</div>

<script>
const DB_NAME="RoadInspectDB";
const DB_VERSION=1;
let db=null;
let currentPage="pageWrite";
let calendarDate=new Date();

async function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains("projects")){
        const os=d.createObjectStore("projects",{keyPath:"id"});
        os.createIndex("name","name",{unique:false});
      }
      if(!d.objectStoreNames.contains("logs")){
        const os=d.createObjectStore("logs",{keyPath:"id"});
        os.createIndex("projectId","projectId",{unique:false});
        os.createIndex("logDate","logDate",{unique:false});
      }
    };
    req.onsuccess=e=>{db=e.target.result;res(db);};
    req.onerror=e=>rej(e.target.error);
  });
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}

async function getAll(storeName){
  return new Promise((res,rej)=>{
    const tx=db.transaction(storeName,"readonly");
    const os=tx.objectStore(storeName);
    const arr=[];
    os.openCursor().onsuccess=e=>{
      const cur=e.target.result;
      if(cur){arr.push(cur.value);cur.continue();}else res(arr);
    };
    tx.onerror=e=>rej(e.target.error);
  });
}
async function putOne(storeName,obj){
  return new Promise((res,rej)=>{
    const tx=db.transaction(storeName,"readwrite");
    const os=tx.objectStore(storeName);
    os.put(obj);
    tx.oncomplete=()=>res(obj);
    tx.onerror=e=>rej(e.target.error);
  });
}
async function delOne(storeName,id){
  return new Promise((res,rej)=>{
    const tx=db.transaction(storeName,"readwrite");
    const os=tx.objectStore(storeName);
    os.delete(id);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}

//水印
function drawWatermark(img,waterText){
  return new Promise(res=>{
    const c=document.createElement("canvas");
    const ctx=c.getContext("2d");
    c.width=img.width;c.height=img.height;
    ctx.drawImage(img,0,0);
    ctx.font=`${Math.max(14,img.width/35)}px sans-serif`;
    ctx.fillStyle="rgba(0,0,0,0.65)";
    ctx.fillText(waterText,12,img.height-12);
    c.toBlob(b=>res(b),"image/jpeg",0.85);
  })
}

//word导出
async function exportWord(log,project,inspectorName){
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType} = window.docx;
  const doc=new Document({sections:[{
    properties:{},
    children:[
      new Paragraph({text:project?.name||"公路巡查日志",alignment:AlignmentType.CENTER,children:[new TextRun({text:project?.name||"公路巡查日志",bold:true,size:32})]}),
      new Paragraph(""),
      new Table({width:{size:100,type:WidthType.PERCENTAGE},
        rows:[
          new TableRow({children:[cell("巡查日期"),cell(log.logDate||""),cell("天气"),cell(log.weather||"")]}),
          new TableRow({children:[cell("巡查桩号范围"),cell(log.stake||""),cell("巡查人"),cell(inspectorName||"")]}),
          new TableRow({children:[cell("路面病害"),cell(log.disease||""),cell("交安设施损坏"),cell(log.safetyFac||"")]}),
          new TableRow({children:[cell("施工安全隐患"),cell(log.risk||""),cell("人员到岗情况"),cell(log.staff||"")]}),
          new TableRow({children:[cell("巡查内容及现场情况",1),cell(log.content||"",3)]}),
        ]
      })
    ]
  }]});
  function cell(text,span=1){
    return new TableCell({columnSpan:span,children:[new Paragraph(text||"")]});
  }
  const buf=await Packer.toBuffer(doc);
  saveAs(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}),`巡查日志_${log.logDate||"no-date"}.docx`);
}

//页面切换
document.querySelectorAll(".tab-bar>div").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab-bar>div").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const pg=t.dataset.page;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(pg).classList.add("active");
    currentPage=pg;
    if(pg==="pageList")renderCalendar();
    if(pg==="pageSetting")renderProjectList();
  }
});

let writePhotos=[];
document.getElementById("filePhoto").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const stake=document.getElementById("inpStake").value||"";
  const insp=localStorage.getItem("inspectorName")||"";
  const reader=new FileReader();
  reader.onload=async ev=>{
    const img=new Image();
    img.src=ev.target.result;
    await new Promise(r=>img.onload=r);
    const waterText=`${new Date().toLocaleString()} | ${stake} | ${insp}`;
    const blob=await drawWatermark(img,waterText);
    const base64=await new Promise(res=>{
      const r2=new FileReader();r2.onload=x=>res(x.target.result);r2.readAsDataURL(blob);
    });
    writePhotos.push({base64,note:""});
    renderWritePhotoList();
  }
  reader.readAsDataURL(f);
  e.target.value="";
};
function renderWritePhotoList(){
  const wrap=document.getElementById("photoListWrite");wrap.innerHTML="";
  writePhotos.forEach((ph,idx)=>{
    const div=document.createElement("div");div.className="photo-item";
    div.innerHTML=`<img src="${ph.base64}"/><textarea placeholder="照片备注" data-idx="${idx}">${ph.note||""}</textarea><button class="btn gray" data-del="${idx}">删除</button>`;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll("textarea").forEach(ta=>{
    ta.oninput=()=>{const i=Number(ta.dataset.idx);writePhotos[i].note=ta.value;};
  })
  wrap.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=()=>{const i=Number(b.dataset.del);writePhotos.splice(i,1);renderWritePhotoList();};
  })
}

async function renderProjectSelect(){
  const pros=await getAll("projects");
  const selWrite=document.getElementById("selProject");
  const selFilter=document.getElementById("selProjectFilter");
  selWrite.innerHTML="";selFilter.innerHTML='<option value="">全部项目</option>';
  pros.forEach(p=>{
    selWrite.innerHTML+=`<option value="${p.id}">${p.name}</option>`;
    selFilter.innerHTML+=`<option value="${p.id}">${p.name}</option>`;
  })
  const last=localStorage.getItem("lastProjectId");
  if(last&&pros.find(x=>x.id===last))selWrite.value=last;
}

async function renderProjectList(){
  const pros=await getAll("projects");
  const wrap=document.getElementById("projectListWrap");wrap.innerHTML="";
  pros.forEach(p=>{
    const div=document.createElement("div");div.className="set-block";
    div.innerHTML=`
    <div>项目名称：${p.name}</div>
    <div>承包单位：${p.contractUnit||""}</div>
    <div>监理单位：${p.superviseUnit||""}</div>
    <div>合同号：${p.contractNo||""}</div>
    <div class="btn-group">
      <button class="btn edit-proj" data-id="${p.id}">编辑</button>
      <button class="btn gray del-proj" data-id="${p.id}">删除</button>
    </div>`;
    wrap.appendChild(div);
  })
  wrap.querySelectorAll(".edit-proj").forEach(b=>b.onclick=()=>editProject(b.dataset.id));
  wrap.querySelectorAll(".del-proj").forEach(b=>b.onclick=async()=>{
    if(!confirm("确定删除该项目？"))return;
    await delOne("projects",b.dataset.id);await renderProjectList();await renderProjectSelect();
  })
}
async function editProject(pid){
  const pros=await getAll("projects");
  const p=pros.find(x=>x.id===pid)||{id:genId(),name:"",contractUnit:"",superviseUnit:"",contractNo:""};
  const name=prompt("项目名称",p.name);if(name===null)return;
  const cu=prompt("承包单位",p.contractUnit||"");
  const su=prompt("监理单位",p.superviseUnit||"");
  const cn=prompt("合同号",p.contractNo||"");
  p.name=name;p.contractUnit=cu;p.superviseUnit=su;p.contractNo=cn;
  await putOne("projects",p);await renderProjectList();await renderProjectSelect();
}
document.getElementById("btnAddProject").onclick=()=>editProject(genId());

//日历
function getMonthDays(y,m){
  return new Date(y,m+1,0).getDate();
}
async function renderCalendar(){
  const y=calendarDate.getFullYear();
  const m=calendarDate.getMonth();
  document.getElementById("calYM").innerText=`${y}年${m+1}月`;
  const first=new Date(y,m,1);
  const startWeek=first.getDay();
  const daysCount=getMonthDays(y,m);
  const prevDays=getMonthDays(y,m-1);
  const logs=await getAll("logs");
  const filterProj=document.getElementById("selProjectFilter").value;
  const dateSet=new Set();
  logs.forEach(l=>{
    if(filterProj&&l.projectId!==filterProj)return;
    dateSet.add(l.logDate);
  })
  const grid=document.getElementById("calGrid");grid.innerHTML="";
  for(let i=0;i<startWeek;i++){
    const d=document.createElement("div");d.className="cal-day other-month";d.innerText=prevDays-startWeek+i+1;grid.appendChild(d);
  }
  for(let d=1;d<=daysCount;d++){
    const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const el=document.createElement("div");
    el.className="cal-day";
    if(new Date().toDateString()===new Date(y,m,d).toDateString())el.classList.add("today");
    if(dateSet.has(ds))el.classList.add("has-record");
    el.innerText=d;el.dataset.date=ds;
    el.onclick=()=>filterLogByDate(ds);
    grid.appendChild(el);
  }
  const total=startWeek+daysCount;
  const rem=(7-total%7)%7;
  for(let i=1;i<=rem;i++){
    const d=document.createElement("div");d.className="cal-day other-month";d.innerText=i;grid.appendChild(d);
  }
  renderLogList();
}
document.getElementById("calPrev").onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar();}
document.getElementById("calNext").onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar();}
let filterDate=null;
function filterLogByDate(d){filterDate=d;renderLogList();}
async function renderLogList(){
  const wrap=document.getElementById("logListWrap");wrap.innerHTML="";
  const logs=await getAll("logs");
  const pros=await getAll("projects");
  const filterProj=document.getElementById("selProjectFilter").value;
  let arr=logs.slice();
  if(filterProj)arr=arr.filter(x=>x.projectId===filterProj);
  if(filterDate)arr=arr.filter(x=>x.logDate===filterDate);
  arr.sort((a,b)=>b.logDate.localeCompare(a.logDate));
  if(arr.length===0){wrap.innerHTML="<div style='padding:12px;text-align:center;color:#777'>暂无巡查日志记录</div>";return;}
  arr.forEach(log=>{
    const proj=pros.find(p=>p.id===log.projectId);
    const div=document.createElement("div");div.className="item-card";
    div.innerHTML=`
      <div><span class="project-tag">${proj?.name||"默认项目"}</span></div>
      <div>日期：${log.logDate||""}</div>
      <div>桩号：${log.stake||""}</div>
      <div>病害：${log.disease||""}</div>
      <div style="margin-top:8px;" class="btn-group">
        <button class="btn export-one" data-id="${log.id}">导出Word</button>
        <button class="btn gray del-one" data-id="${log.id}">删除</button>
      </div>`;
    wrap.appendChild(div);
  })
  wrap.querySelectorAll(".export-one").forEach(b=>b.onclick=async()=>{
    const lid=b.dataset.id;
    const log=logs.find(x=>x.id===lid);
    const pros=await getAll("projects");
    const p=pros.find(x=>x.id===log.projectId);
    const insp=localStorage.getItem("inspectorName")||"";
    await exportWord(log,p,insp);
  })
  wrap.querySelectorAll(".del-one").forEach(b=>b.onclick=async()=>{
    if(!confirm("确定删除这条日志？删除不可恢复！"))return;
    await delOne("logs",b.dataset.id);renderCalendar();
  })
}
document.getElementById("selProjectFilter").onchange=()=>{filterDate=null;renderCalendar();}

document.getElementById("btnSaveLog").onclick=async()=>{
  const pid=document.getElementById("selProject").value;
  const logDate=document.getElementById("inpDate").value;
  const weather=document.getElementById("inpWeather").value;
  const stake=document.getElementById("inpStake").value;
  const content=document.getElementById("inpContent").value;
  const safetyFac=document.getElementById("inpSafetyFac").value;
  const risk=document.getElementById("inpRisk").value;
  const staff=document.getElementById("inpStaff").value;
  const otherDisease=document.getElementById("inpDiseaseOther").value;
  const chks=Array.from(document.querySelectorAll(".chkDisease:checked")).map(c=>c.value);
  if(otherDisease)chks.push(otherDisease);
  const disease=chks.join("；");
  if(!pid||!logDate){alert("请选择项目并填写巡查日期");return;}
  const logObj={
    id:genId(),projectId:pid,logDate,weather,stake,content,
    disease,safetyFac,risk,staff,photos:[...writePhotos]
  };
  await putOne("logs",logObj);
  localStorage.setItem("lastProjectId",pid);
  alert("保存成功");
  resetWriteForm();
}
function resetWriteForm(){
  document.getElementById("inpDate").value=new Date().toISOString().slice(0,10);
  document.getElementById("inpWeather").value="";
  document.getElementById("inpStake").value="";
  document.getElementById("inpContent").value="";
  document.getElementById("inpSafetyFac").value="";
  document.getElementById("inpRisk").value="";
  document.getElementById("inpStaff").value="";
  document.getElementById("inpDiseaseOther").value="";
  document.querySelectorAll(".chkDisease").forEach(c=>c.checked=false);
  writePhotos=[];renderWritePhotoList();
}

document.getElementById("inpInspector").oninput=e=>{
  localStorage.setItem("inspectorName",e.target.value);
}
document.getElementById("btnExportAll").onclick=async()=>{
  const logs=await getAll("logs");
  const pros=await getAll("projects");
  const insp=localStorage.getItem("inspectorName")||"";
  for(const lg of logs){
    const p=pros.find(x=>x.id===lg.projectId);
    await exportWord(lg,p,insp);
  }
}

async function init(){
  await openDB();
  if(!(await getAll("projects")).length){
    await putOne("projects",{id:"default",name:"默认项目",contractUnit:"",superviseUnit:"",contractNo:""});
  }
  await renderProjectSelect();
  resetWriteForm();
  const inspSaved=localStorage.getItem("inspectorName")||"";
  document.getElementById("inpInspector").value=inspSaved;
}
init();
</script>
</body>
</html>
