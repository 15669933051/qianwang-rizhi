<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>施工日志</title>
    <!-- docx生成依赖CDN -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.37.12/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.4/dist/pizzip-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater-image-module-free@1.1.1/dist/image-module.js"></script>
    <style>
        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SimSun", sans-serif;
        }
        body{
            background:#f0f2f5;
            padding-bottom:80px;
        }
        .header{
            background:#1a73e8;
            color:#fff;
            text-align:center;
            padding:14px 10px;
            font-size:17px;
            font-weight:600;
            line-height:1.4;
        }
        .wrap{
            padding:12px;
        }
        .form-card{
            background:#fff;
            border-radius:8px;
            padding:12px;
            margin-bottom:12px;
        }
        .row{
            display:flex;
            gap:8px;
            margin-bottom:10px;
            align-items:center;
        }
        .row label{
            width:80px;
            font-size:14px;
            color:#333;
            flex-shrink:0;
        }
        .row input, .row select{
            flex:1;
            border:1px solid #ddd;
            border-radius:6px;
            padding:10px 8px;
            font-size:15px;
        }
        .full-row{
            margin-bottom:10px;
        }
        .full-row label{
            display:block;
            font-size:14px;
            color:#333;
            margin-bottom:6px;
            font-weight:500;
        }
        .full-row textarea{
            width:100%;
            border:1px solid #ddd;
            border-radius:6px;
            padding:10px;
            font-size:15px;
            min-height:80px;
            resize:vertical;
        }
        .title-row{
            background:#f5f7fa;
            padding:8px 10px;
            border-radius:6px;
            font-size:14px;
            font-weight:600;
            color:#1a73e8;
            margin-bottom:10px;
        }
        /* 拍照区域 */
        .photo-box{
            margin-top:8px;
        }
        .photo-btn{
            width:100%;
            padding:12px;
            background:#e8f0fe;
            border:1px dashed #1a73e8;
            border-radius:6px;
            color:#1a73e8;
            font-size:15px;
            text-align:center;
        }
        .photo-list{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            margin-top:8px;
        }
        .photo-item{
            width:80px;
            height:80px;
            border-radius:6px;
            overflow:hidden;
            position:relative;
        }
        .photo-item img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .photo-del{
            position:absolute;
            top:2px;
            right:2px;
            width:20px;
            height:20px;
            background:rgba(0,0,0,0.6);
            color:#fff;
            border-radius:50%;
            font-size:12px;
            text-align:center;
            line-height:20px;
        }
        /* 保存按钮 */
        .save-btn-wrap{
            padding:12px;
        }
        #saveLogBtn{
            width:100%;
            padding:14px;
            background:#1a73e8;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
        }
        /* 底部导航 */
        .tab-bar{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            display:flex;
            background:#fff;
            border-top:1px solid #ddd;
        }
        .tab{
            flex:1;
            text-align:center;
            padding:12px 0;
            font-size:15px;
            color:#666;
        }
        .tab.active{
            color:#1a73e8;
            font-weight:500;
        }
        .page{
            display:none;
        }
        .page.active{
            display:block;
        }
        /* 日志列表 */
        .log-card{
            background:#fff;
            border-radius:8px;
            padding:12px;
            margin-bottom:10px;
        }
        .log-card h4{
            font-size:15px;
            color:#333;
            margin-bottom:8px;
            border-bottom:1px solid #eee;
            padding-bottom:6px;
        }
        .log-card p{
            font-size:13px;
            line-height:1.6;
            color:#555;
            margin-bottom:3px;
        }
        .log-card p b{
            color:#333;
        }
        .log-photos{
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            margin-top:8px;
        }
        .log-photos img{
            width:70px;
            height:70px;
            border-radius:4px;
            object-fit:cover;
        }
        .del-btn{
            margin-top:8px;
            color:#e53935;
            border:none;
            background:none;
            font-size:14px;
        }
        .docx-btn{
            margin-top:8px;
            margin-right:12px;
            color:#1a73e8;
            border:none;
            background:none;
            font-size:14px;
        }
        .print-btn{
            margin-top:8px;
            margin-right:12px;
            color:#2e7d32;
            border:none;
            background:none;
            font-size:14px;
        }
        .add-row{
            display:flex;
            gap:6px;
            margin-top:6px;
        }
        .add-row input{
            flex:1;
            border:1px solid #ddd;
            border-radius:6px;
            padding:8px;
            font-size:14px;
        }
        .add-row button{
            width:70px;
            background:#1a73e8;
            color:#fff;
            border:none;
            border-radius:6px;
            font-size:14px;
        }
        .empty-tip{
            text-align:center;
            color:#999;
            padding:40px 0;
            font-size:14px;
        }
        .list-top-bar{
            display:flex;
            gap:10px;
            margin-bottom:12px;
            flex-wrap:wrap;
        }
        .list-top-bar button{
            flex:1;
            min-width:110px;
            padding:10px;
            border:none;
            border-radius:6px;
            background:#1a73e8;
            color:#fff;
            font-size:14px;
        }
        /*打印专用样式 A4 【3张一行】 */
        @media print{
            @page{
                size:A4 portrait;
                margin:18mm;
            }
            body *{visibility:hidden;}
            #printWrap, #printWrap *{visibility:visible;}
            #printWrap{
                position:absolute;
                left:0;
                top:0;
                width:210mm;
                padding:0;
                background:#fff;
            }
            .tab-bar,.save-btn-wrap,.list-top-bar,.del-btn,.docx-btn,.print-btn{display:none !important;}

            #printWrap .img-wrap{
                overflow:hidden;
                margin:8mm 0;
                page-break-inside:avoid;
                mso-page-break-inside:avoid;
            }
            #printWrap .img-item{
                width:calc((100% - 16mm)/3);
                float:left;
                margin-right:8mm;
                margin-bottom:8mm;
                page-break-inside:avoid;
                mso-page-break-inside:avoid;
            }
            #printWrap .img-item:nth-child(3n){
                margin-right:0;
            }
            #printWrap .img-item img{
                width:100%;
                height:auto;
                max-height:70mm;
                object-fit:contain;
                display:block;
                border:0.2mm solid #aaa;
            }
        }
        #importFileInput{display:none;}
    </style>
</head>
<body>
    <div class="header">
        临安区"四好农村路"2026年提升工程<br>施工日志
    </div>

    <div class="wrap">
        <!-- 记日志页面 -->
        <div id="page-form" class="page active">
            <div class="form-card">
                <div class="row">
                    <label>选择项目</label>
                    <select id="project"></select>
                </div>
                <div class="add-row">
                    <input type="text" id="newProjectInput" placeholder="输入新项目名称">
                    <button id="addProjectBtn">添加</button>
                </div>
            </div>

            <div class="form-card">
                <div class="row">
                    <label>项目地址</label>
                    <input type="text" id="projectAddr" placeholder="如：临安">
                </div>
                <div class="row">
                    <label>建设单位</label>
                    <input type="text" id="buildUnit" placeholder="建设单位名称">
                </div>
                <div class="row">
                    <label>施工单位</label>
                    <input type="text" id="contractor" placeholder="承包/施工单位">
                </div>
                <div class="row">
                    <label>监理单位</label>
                    <input type="text" id="supervisor" placeholder="监理单位">
                </div>
                <div class="row">
                    <label>合同号</label>
                    <input type="text" id="contractNo" placeholder="合同编号">
                </div>
            </div>

            <div class="form-card">
                <div class="row">
                    <label>施工日期</label>
                    <input type="date" id="workDate">
                </div>
                <div class="row">
                    <label>天气风向</label>
                    <input type="text" id="weather" placeholder="晴 东北风2级">
                </div>
                <div class="row">
                    <label>气温</label>
                    <input type="text" id="tempInfo" placeholder="19℃">
                </div>
                <div class="row">
                    <label>负责人</label>
                    <input type="text" id="personCharge" placeholder="负责人">
                </div>
                <div class="row">
                    <label>记录人</label>
                    <input type="text" id="recorder" placeholder="记录人">
                </div>
            </div>

            <div class="form-card">
                <div class="full-row">
                    <label>■ 生产记录 - 今日完成</label>
                    <textarea id="workToday" placeholder="填写今日完成工程量、施工内容..."></textarea>
                </div>
                <div class="full-row">
                    <label>■ 生产记录 - 明日计划</label>
                    <textarea id="workTomorrow" placeholder="明日施工计划、人员机械安排..."></textarea>
                </div>
            </div>

            <div class="form-card">
                <div class="full-row">
                    <label>■ 质量与安全</label>
                    <textarea id="qualitySafe" placeholder="质量检查、安全隐患、管控情况..."></textarea>
                </div>
            </div>

            <div class="form-card">
                <div class="full-row">
                    <label>■ 现场照片</label>
                    <div class="photo-box">
                        <input type="file" id="photoInput" accept="image/*" style="display:none">
                        <button class="photo-btn" onclick="document.getElementById('photoInput').click()">📷 拍照 / 从相册选择照片</button>
                        <div class="photo-list" id="photoList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日志列表页面（导出docx、打印在这里） -->
        <div id="page-list" class="page">
            <div class="list-top-bar">
                <button onclick="exportAllBackup()">📦全部日志备份(json)</button>
                <button onclick="document.getElementById('importFileInput').click()">📂导入备份</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none">
            </div>
            <div id="listBox"></div>
        </div>

        <!-- 设置页面 -->
        <div id="page-set" class="page">
            <div class="form-card">
                <div class="title-row">项目管理</div>
                <div id="projectManageBox"></div>
            </div>
            <div class="form-card">
                <div class="title-row">项目信息设置（先选项目再编辑）</div>
                <div class="row">
                    <label>选择项目</label>
                    <select id="setProjectSel"></select>
                </div>
                <div class="row">
                    <label>项目地址</label>
                    <input type="text" id="setProjectAddr" placeholder="该项目地址">
                </div>
                <div class="row">
                    <label>建设单位</label>
                    <input type="text" id="setBuildUnit" placeholder="该项目建设单位">
                </div>
                <div class="row">
                    <label>施工单位</label>
                    <input type="text" id="setContractor" placeholder="该项目施工单位">
                </div>
                <div class="row">
                    <label>监理单位</label>
                    <input type="text" id="setSupervisor" placeholder="该项目监理单位">
                </div>
                <div class="row">
                    <label>合同号</label>
                    <input type="text" id="setContractNo" placeholder="该项目合同号">
                </div>
                <button class="add-row" style="width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:6px;font-size:15px;margin-top:10px;" onclick="saveProjectInfo()">保存当前项目信息</button>
            </div>
        </div>
    </div>

    <!-- 独立保存按钮 -->
    <div class="save-btn-wrap">
        <button id="saveLogBtn">💾保存本条施工日志</button>
    </div>

    <div class="tab-bar">
        <div class="tab" data-page="page-form">记日志</div>
        <div class="tab" data-page="page-list">日志列表</div>
        <div class="tab" data-page="page-set">设置</div>
    </div>

    <!--打印临时容器-->
    <div id="printWrap" style="display:none;"></div>

<script>
// ========== 项目管理：每个项目对象 ==========
function getProjectList(){
    const raw = localStorage.getItem('roadProjectList');
    if(raw){
        const arr = JSON.parse(raw);
        //兼容老版本：升级旧数据结构
        if(arr.length>0 && typeof arr[0]==='string'){
            return arr.map(n=>({
                name:n,
                projectAddr:'',
                buildUnit:'',
                contractor:'',
                supervisor:'',
                contractNo:''
            }));
        }
        return arr;
    }
    return [{
        name:"默认项目",
        projectAddr:'',
        buildUnit:'',
        contractor:'',
        supervisor:'',
        contractNo:''
    }];
}
function saveProjectList(arr){
    localStorage.setItem('roadProjectList', JSON.stringify(arr));
}
// 根据项目名称查找项目对象
function findProject(name){
    return getProjectList().find(p=>p.name === name);
}
// 渲染【记日志页】项目下拉
function renderProjectSelect(){
    const sel = document.getElementById('project');
    const list = getProjectList();
    sel.innerHTML = "";
    list.forEach(p=>{
        const opt = document.createElement('option');
        opt.innerText = p.name;
        opt.value = p.name;
        sel.appendChild(opt);
    })
    bindProjectChange();
    fillByProject(sel.value);
}
// 渲染【设置页】项目下拉
function renderSetProjectSel(){
    const sel = document.getElementById('setProjectSel');
    const list = getProjectList();
    sel.innerHTML = "";
    list.forEach(p=>{
        const opt = document.createElement('option');
        opt.innerText = p.name;
        opt.value = p.name;
        sel.appendChild(opt);
    })
    bindSetProjectChange();
    fillSetFormByProject(sel.value);
}
// 记日志页切换项目，自动回填全部项目信息
function bindProjectChange(){
    const sel = document.getElementById('project');
    sel.onchange = function(){
        fillByProject(this.value);
    }
}
function fillByProject(projName){
    const p = findProject(projName);
    if(p){
        document.getElementById('projectAddr').value = p.projectAddr;
        document.getElementById('buildUnit').value = p.buildUnit;
        document.getElementById('contractor').value = p.contractor;
        document.getElementById('supervisor').value = p.supervisor;
        document.getElementById('contractNo').value = p.contractNo;
    }
}
// 设置页切换项目，加载该项目信息到输入框
function bindSetProjectChange(){
    const sel = document.getElementById('setProjectSel');
    sel.onchange = function(){
        fillSetFormByProject(this.value);
    }
}
function fillSetFormByProject(projName){
    const p = findProject(projName);
    if(p){
        document.getElementById('setProjectAddr').value = p.projectAddr;
        document.getElementById('setBuildUnit').value = p.buildUnit;
        document.getElementById('setContractor').value = p.contractor;
        document.getElementById('setSupervisor').value = p.supervisor;
        document.getElementById('setContractNo').value = p.contractNo;
    }
}
// 设置页保存当前选中项目的信息
function saveProjectInfo(){
    const selName = document.getElementById('setProjectSel').value;
    const arr = getProjectList();
    const target = arr.find(p=>p.name === selName);
    if(target){
        target.projectAddr = document.getElementById('setProjectAddr').value;
        target.buildUnit = document.getElementById('setBuildUnit').value;
        target.contractor = document.getElementById('setContractor').value;
        target.supervisor = document.getElementById('setSupervisor').value;
        target.contractNo = document.getElementById('setContractNo').value;
    }
    saveProjectList(arr);
    renderProjectSelect();
    alert("✅该项目信息已保存！切换项目会自动带出");
}
// 添加新项目
document.getElementById('addProjectBtn').onclick = function(){
    const val = document.getElementById('newProjectInput').value.trim();
    if(!val){ alert("项目名称不能为空"); return; }
    const arr = getProjectList();
    if(arr.some(p=>p.name === val)){ alert("该项目已存在"); return; }
    arr.push({
        name:val,
        projectAddr:'',
        buildUnit:'',
        contractor:'',
        supervisor:'',
        contractNo:''
    });
    saveProjectList(arr);
    renderProjectSelect();
    renderSetProjectSel();
    document.getElementById('newProjectInput').value = "";
}

// ========== 拍照&相册选择功能 ==========
let photos = []; // 存base64图片
document.getElementById('photoInput').onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
        // 压缩图片
        const img = new Image();
        img.onload = function(){
            const canvas = document.createElement('canvas');
            const maxW = 1200;
            const scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressed = canvas.toDataURL('image/jpeg', 0.7);
            photos.push(compressed);
            renderPhotos();
        }
        img.src = ev.target.result;
    }
    reader.readAsDataURL(file);
    e.target.value = "";
}
function renderPhotos(){
    const box = document.getElementById('photoList');
    box.innerHTML = "";
    photos.forEach((p, idx)=>{
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `<img src="${p}"><div class="photo-del" onclick="delPhoto(${idx})">×</div>`;
        box.appendChild(div);
    })
}
function delPhoto(idx){
    photos.splice(idx, 1);
    renderPhotos();
}

// ========== 默认日期 ==========
const today = new Date();
const y = today.getFullYear();
const m = String(today.getMonth()+1).padStart(2,'0');
const d = String(today.getDate()).padStart(2,'0');
document.getElementById('workDate').value = `${y}-${m}-${d}`;

// ========== Tab切换 ==========
const tabs = document.querySelectorAll('.tab');
tabs.forEach(tab=>{
    tab.onclick = ()=>{
        tabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const targetId = tab.dataset.page;
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById(targetId).classList.add('active');
        if(targetId === 'page-list') renderList();
        if(targetId === 'page-set') {
            renderProjectManage();
            renderSetProjectSel();
        }
    }
})

// ========== 日志存储 ==========
function getLogs(){
    const raw = localStorage.getItem('roadLog');
    return raw ? JSON.parse(raw) : [];
}
function saveLogs(arr){
    localStorage.setItem('roadLog', JSON.stringify(arr));
}

// =====【独立保存按钮】=====
document.getElementById('saveLogBtn').onclick = function(){
    const workDate = document.getElementById('workDate').value;
    if(!workDate){ alert('施工日期不能为空！'); return; }

    const log = {
        id: Date.now(),
        project: document.getElementById('project').value,
        projectAddr: document.getElementById('projectAddr').value,
        buildUnit: document.getElementById('buildUnit').value,
        contractor: document.getElementById('contractor').value,
        supervisor: document.getElementById('supervisor').value,
        contractNo: document.getElementById('contractNo').value,
        workDate: workDate,
        weather: document.getElementById('weather').value,
        tempInfo: document.getElementById('tempInfo').value,
        personCharge: document.getElementById('personCharge').value,
        recorder: document.getElementById('recorder').value,
        workToday: document.getElementById('workToday').value,
        workTomorrow: document.getElementById('workTomorrow').value,
        qualitySafe: document.getElementById('qualitySafe').value,
        photos: [...photos]
    };
    const logs = getLogs();
    logs.unshift(log);
    saveLogs(logs);
    alert('✅日志保存成功！');
    //清空表单，保留项目信息、日期
    photos = []; renderPhotos();
    document.getElementById('workToday').value = '';
    document.getElementById('workTomorrow').value = '';
    document.getElementById('qualitySafe').value = '';
    document.getElementById('weather').value = '';
    document.getElementById('tempInfo').value = '';
    document.getElementById('personCharge').value = '';
    document.getElementById('recorder').value = '';
}

// ========== 单条A4浏览器打印功能 ==========
function printItem(logItem){
    let imgHtml = "";
    if(logItem.photos && logItem.photos.length>0){
        imgHtml += `<div class="img-wrap">`;
        logItem.photos.forEach(p=>{
            imgHtml += `<div class="img-item"><img src="${p}"></div>`;
        })
        imgHtml += `</div>`;
    }
    const printHtml = `
<div style="width:100%;padding:0 4mm;">
    <h2 align="center" style="font-size:22pt;margin-bottom:4pt;">施工日志</h2>
    <p align="center" style="font-size:13pt;color:#444;margin-bottom:10pt;">${logItem.workDate}　${logItem.weather || ''}　${logItem.tempInfo || ''}</p>
    <hr style="border:0.5pt solid #333;margin:8pt 0;">
    <p style="font-size:12pt;line-height:1.5;"><b>项目名称：</b>${logItem.project||""}</p>
    <p style="font-size:12pt;line-height:1.5;"><b>项目地址：</b>${logItem.projectAddr||""}</p>
    <p style="font-size:12pt;line-height:1.5;"><b>建设单位：</b>${logItem.buildUnit||""}</p>
    <p style="font-size:12pt;line-height:1.5;"><b>施工单位：</b>${logItem.contractor||""}</p>
    <hr style="border:0.3pt solid #999;margin:8pt 0;">
    <h3 style="font-size:14pt;margin:8pt 0;">■ 生产记录</h3>
    <p style="font-size:12pt;line-height:1.5;"><b>今日完成：</b></p>
    <p style="font-size:12pt;line-height:1.5;white-space:pre-line;">${logItem.workToday||""}</p>
    <p style="font-size:12pt;line-height:1.5;margin-top:6pt;"><b>明日计划：</b></p>
    <p style="font-size:12pt;line-height:1.5;white-space:pre-line;">${logItem.workTomorrow||""}</p>
    <h3 style="font-size:14pt;margin:12pt 0 8pt 0;">■ 质量与安全</h3>
    <p style="font-size:12pt;line-height:1.5;white-space:pre-line;">${logItem.qualitySafe||""}</p>
    <h3 style="font-size:14pt;margin:12pt 0 8pt 0;">■ 现场照片</h3>
    ${imgHtml}
    <hr style="border:0.3pt solid #999;margin:12pt 0;">
    <div style="display:flex;justify-content:space-between;font-size:12pt;margin-top:8pt;">
        <p><b>负责人：</b>${logItem.personCharge||""}</p>
        <p><b>记录人：</b>${logItem.recorder||""}</p>
    </div>
</div>
`;
    const wrapDom = document.getElementById('printWrap');
    wrapDom.innerHTML = printHtml;
    setTimeout(()=>{
        window.print();
        wrapDom.innerHTML = "";
    },100);
}

// ========== 【升级：原生docx + 图片三列表格排版】 ==========
async function exportRealDocx(logItem){
    alert("正在生成docx，照片越多耗时越长，请稍候……");
    // 图片模块初始化
    const imageModule = new ImageModule({
        getImage: async function(r, a) {
            return await fetch(r).then(res=>res.arrayBuffer());
        },
        getSize: function(imgBuffer){
            return {width:210, height:140}; // 固定图片尺寸，A4一行3张
        }
    });

    // 构建图片行数组，每3张一组
    const photoRows = [];
    const photosArr = logItem.photos || [];
    for(let i=0;i<photosArr.length;i+=3){
        const chunk = photosArr.slice(i,i+3);
        photoRows.push({
            img1: chunk[0] || null,
            img2: chunk[1] || null,
            img3: chunk[2] || null
        })
    }

    // A4模板，表格3列，循环行渲染图片
    const templateContent = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<pkg:package xmlns:pkg="http://schemas.openxmlformats.org/package/2006">
<pkg:types xmlns:pkg="http://schemas.openxmlformats.org/package/2006">
<pkg:default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<pkg:default Extension="xml" ContentType="application/xml"/>
<pkg:override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</pkg:types>
<pkg:part name="/word/document.xml" contentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml">
<pkg:xmlData>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
<w:p><w:r><w:t>施工日志</w:t></w:r></w:p>
<w:p><w:r><w:t>{dateInfo}</w:t></w:r></w:p>
<w:p><w:r><w:t>项目名称：{project}</w:t></w:r></w:p>
<w:p><w:r><w:t>项目地址：{projectAddr}</w:t></w:r></w:p>
<w:p><w:r><w:t>建设单位：{buildUnit}</w:t></w:r></w:p>
<w:p><w:r><w:t>施工单位：{contractor}</w:t></w:r></w:p>
<w:p><w:r><w:t>监理单位：{supervisor}</w:t></w:r></w:p>
<w:p><w:r><w:t>合同号：{contractNo}</w:t></w:r></w:p>
<w:p><w:r><w:t>■生产记录 今日完成：{workToday}</w:t></w:r></w:p>
<w:p><w:r><w:t>■生产记录 明日计划：{workTomorrow}</w:t></w:r></w:p>
<w:p><w:r><w:t>■质量与安全：{qualitySafe}</w:t></w:r></w:p>
<w:p><w:r><w:t>■现场照片</w:t></w:r></w:p>
{#photoRows}
<w:tbl>
<w:tblPr><w:tblW w:w="5000" w:type="pct"/></w:tblPr>
<w:tr>
<w:tc><w:p>{#img1}{@img1}{/img1}</w:p></w:tc>
<w:tc><w:p>{#img2}{@img2}{/img2}</w:p></w:tc>
<w:tc><w:p>{#img3}{@img3}{/img3}</w:p></w:tc>
</w:tr>
</w:tbl>
{/photoRows}
<w:p><w:r><w:t>负责人：{personCharge}　记录人：{recorder}</w:t></w:r></w:p>
</w:body>
</w:document>
</pkg:xmlData>
</pkg:part>
<pkg:part name="/_rels/.rels" contentType="application/vnd.openxmlformats-package.relationships+xml">
<pkg:xmlData>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>
</pkg:xmlData>
</pkg:part>
</pkg:package>`;

    const zip = new PizZip(templateContent);
    const doc = new window.docxtemplater(zip, {
        modules: [imageModule],
        nullGetter:function(){return "";}
    });
    doc.render({
        dateInfo:`${logItem.workDate} ${logItem.weather||""} ${logItem.tempInfo||""}`,
        project:logItem.project||"",
        projectAddr:logItem.projectAddr||"",
        buildUnit:logItem.buildUnit||"",
        contractor:logItem.contractor||"",
        supervisor:logItem.supervisor||"",
        contractNo:logItem.contractNo||"",
        workToday:logItem.workToday||"",
        workTomorrow:logItem.workTomorrow||"",
        qualitySafe:logItem.qualitySafe||"",
        personCharge:logItem.personCharge||"",
        recorder:logItem.recorder||"",
        photoRows: photoRows
    });
    const out = doc.getZip().generate({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(out);
    a.download = `施工日志_${logItem.workDate}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
}

//全部日志备份json
function exportAllBackup(){
    const allData = {
        projectList:getProjectList(),
        logs:getLogs()
    };
    const blob = new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `施工日志全部备份_${new Date().toLocaleDateString()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    alert("全部备份已下载！妥善保存，清除浏览器缓存后可以恢复数据");
}

//导入备份
document.getElementById('importFileInput').onchange=function(e){
    const f = e.target.files[0];
    if(!f) return;
    const reader=new FileReader();
    reader.onload=function(ev){
        try{
            const data=JSON.parse(ev.target.result);
            if(data.projectList) saveProjectList(data.projectList);
            if(data.logs) saveLogs(data.logs);
            renderProjectSelect();
            renderSetProjectSel();
            renderProjectManage();
            alert("✅导入备份成功！");
        }catch(err){
            alert("文件格式错误，不是备份json");
        }
    }
    reader.readAsText(f);
    e.target.value="";
}

// ========== 日志列表渲染 ==========
function renderList(){
    const box = document.getElementById('listBox');
    const logs = getLogs();
    if(logs.length === 0){
        box.innerHTML = '<div class="empty-tip">暂无施工日志记录</div>';
        return;
    }
    let html = '';
    logs.forEach(item=>{
        html += `
        <div class="log-card">
            <h4>${item.workDate} 施工日志｜${item.project}</h4>
            <p><b>项目地址：</b>${item.projectAddr || '-'}</p>
            <p><b>建设单位：</b>${item.buildUnit || '-'}</p>
            <p><b>施工单位：</b>${item.contractor || '-'}</p>
            <p><b>天气：</b>${item.weather || '-'}　气温：${item.tempInfo||'-'}</p>
            <p><b>【今日完成】</b>${item.workToday || '-'}</p>
            <p><b>【明日计划】</b>${item.workTomorrow || '-'}</p>
            <p><b>【质量安全】</b>${item.qualitySafe || '-'}</p>
            ${item.photos && item.photos.length > 0 ? `<div class="log-photos">${item.photos.map(p=>`<img src="${p}">`).join('')}</div>` : ''}
            <p><b>负责人：</b>${item.personCharge||'-'}　记录人：${item.recorder||'-'}</p>
            <button class="print-btn" data-id="${item.id}">🖨打印A4</button>
            <button class="docx-btn" data-id="${item.id}">📄导出原生docx</button>
            <button class="del-btn" data-id="${item.id}">删除本条</button>
        </div>
        `
    })
    box.innerHTML = html;
    //打印按钮
    document.querySelectorAll('.print-btn').forEach(btn=>{
        btn.onclick = ()=>{
            const id = Number(btn.dataset.id);
            const oneLog = getLogs().find(x=>x.id===id);
            if(oneLog) printItem(oneLog);
        }
    })
    //导出docx按钮
    document.querySelectorAll('.docx-btn').forEach(btn=>{
        btn.onclick = async ()=>{
            const id = Number(btn.dataset.id);
            const oneLog = getLogs().find(x=>x.id===id);
            if(oneLog) await exportRealDocx(oneLog);
        }
    })
    document.querySelectorAll('.del-btn').forEach(btn=>{
        btn.onclick = ()=>{
            if(!confirm('确定删除这条日志吗？')) return;
            const delId = Number(btn.dataset.id);
            let arr = getLogs().filter(x=>x.id !== delId);
            saveLogs(arr);
            renderList();
        }
    })
}

// ========== 项目管理（设置页） ==========
function renderProjectManage(){
    const box = document.getElementById('projectManageBox');
    const list = getProjectList();
    let html = "";
    list.forEach(p=>{
        html += `
        <div class="log-card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-size:14px;">${p.name}</span>
            <button class="del-btn" data-pro="${p.name}" style="margin-top:0;">删除</button>
        </div>
        `
    })
    box.innerHTML = html;
    document.querySelectorAll('.del-btn').forEach(btn=>{
        btn.onclick = ()=>{
            const pName = btn.dataset.pro;
            if(pName === "默认项目"){ alert("默认项目不能删除"); return; }
            if(!confirm(`确定删除项目「${pName}」吗？`)) return;
            let arr = getProjectList().filter(x=>x.name!==pName);
            saveProjectList(arr);
            renderProjectSelect();
            renderSetProjectSel();
            renderProjectManage();
        }
    })
}

// 初始化
renderProjectSelect();
//默认打开记日志tab
document.querySelector('[data-page="page-form"]').classList.add('active');
document.querySelector('.tab[data-page="page-form"]').classList.add('active');
</script>
